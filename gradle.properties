# Projektweite Gradle-Einstellungen fuer DropSync.
# JVM-Einstellungen fuer den Gradle-Daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX ist verbindlich; Jetifier wird nicht benoetigt, weil keine
# Legacy-Support-Bibliotheken verwendet werden.
android.useAndroidX=true

# Buildzeit: Konfigurations- und Build-Cache.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin-Codestil ist offiziell, nicht IDE-abhaengig.
kotlin.code.style=official

# Nur benoetigte Ressourcen der deklarierten Sprachen (de, en) paketieren.
android.nonTransitiveRClass=true
